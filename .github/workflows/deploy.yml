name: deploy

# The hanzo.el docs are a SITE, not an App.
#
# They used to publish through actions/deploy-pages — GitHub Pages built the
# Jekyll source with actions/jekyll-build-pages and served it from
# hanzoai.github.io/hanzo.el. That is a second deploy plane living outside our
# own CI/CD, outside the Sites plane, and outside our analytics, so it is gone.
#
#   jekyll build docs -> _site
#     -> site
#
# The publish mechanics are NOT here. They are bin/site in hanzoai/ci,
# reached through its action, and every static surface in the fleet calls that one
# script — ensure-project, enqueue, presigned per-file upload, complete. A
# contract transcribed per repo is a contract that drifts, and this file used to
# carry its own copy of every call. It also SELF-PROVISIONS: the project is
# created idempotently before the enqueue, so committing this file is enough to
# stand the site up.
#
# WHERE THIS FITS: a Site is static bytes, no compute. It is not an App (no CR,
# no pods, no image) and not a Function. A docs export is the first of those and
# only the first.

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    # NOT ubuntu-latest. These run on the in-cluster act_runner, whose fleet
    # advertises linux-amd64. A label no runner answers does not
    # fail — it queues until the 24h timeout, which is silence, not an error.
    runs-on: linux-amd64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: build the static export
        run: |
          set -euo pipefail
          # The job image (catthehacker/ubuntu:act-24.04) ships node, python and
          # go — not ruby. ruby-dev + build-essential are for jekyll's native
          # extensions (http_parser.rb), which fail to compile without them.
          SUDO=; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          $SUDO apt-get update -qq
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ruby ruby-dev build-essential >/dev/null
          # Pinned: a background jekyll release must not silently change what
          # this site is built with.
          $SUDO gem install --no-document jekyll:4.4.1
          jekyll build --source docs --destination _site
          test -s _site/index.html || { echo "::error::jekyll produced no _site/index.html"; exit 1; }
          echo "exported $(find _site -type f | wc -l) files"

      # The ONE analytics wire: cloud's hosted tag (cloud apps/analytics/tag.go),
      # which posts the canonical batch to POST /v1/event. There is no GA, no
      # Plausible, no second tracker, and no vendored copy of the tag — it is
      # served from the origin that eats it so a page allowlists ONE host.
      #
      # The key is the project's OWN publishable key, read from the project this
      # run is about to deploy. It is never a checked-in constant: pk- is
      # write-only and publishable (same trust class as a Sentry DSN), so it
      # belongs in the page, but its authority is the project record, which means
      # rotation is one server-side change and not five repo edits.
      #
      # NO KEY => NO TAG, deliberately. A keyless beacon is accepted 200 into
      # $public, a reserved tenant this org cannot read, so silence is the honest
      # failure and we pick it over reporting into a tenant nobody reads.
      #
      # Injection happens HERE rather than in _layouts/default.html because the
      # other doc sites in this fleet export rustdoc and storybook HTML that no
      # layout of ours can reach. One mechanism for all of them.
      - name: wire the analytics tag
        env:
          DEPLOY_TOKEN: ${{ secrets.HANZO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          KEY=$(curl -sS -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
                  "https://api.hanzo.ai/v1/projects/hanzo-el" | jq -r '.key // empty')
          if [ -z "$KEY" ]; then
            echo "::warning::project hanzo-el exposes no publishable key — publishing untagged rather than beaconing into \$public"
            exit 0
          fi
          TAG="<script defer src=\"https://api.hanzo.ai/v1/event.js\" data-key=\"${KEY}\" data-product=\"hanzo.el\"></script>"
          find _site -name '*.html' -print0 | xargs -0 -r sed -i "s#</head>#${TAG}</head>#"
          echo "tagged $(grep -rl 'v1/event.js' _site | wc -l) pages"

      # ONE credential. The 202 carries a prefix-scoped, 30-minute presigned POST
      # grant, so nothing here holds a bucket key. Do NOT add SITES_S3_* — that is
      # the standing shared-bucket credential the grant replaced, and it could
      # overwrite every other org's site.
      - name: Publish to the Sites plane
        uses: hanzoai/ci/.github/actions/site@v1
        with:
          slug: hanzo-el
          dir: _site
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
